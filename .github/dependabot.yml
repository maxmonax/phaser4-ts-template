version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The types follow the oldest Node in "engines" (package.json), so the compiler rejects
      # APIs that Node lacks. Raise them by hand together with "engines".
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A TypeScript major is moved to by hand: typescript-eslint has to support it first.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
