name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # type-check, lint, formatting, unit tests
      - run: npm run check
      # every platform, and no platform build carries another platform's adapter
      - run: npm run build:all
      - run: npm run check:builds
      # every build starts in a headless browser, with a mock of its SDK
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
